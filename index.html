<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To_Do List App</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <h2>To-Do List:</h2>
            <div class="row">
                <input type="text" id="input-box" placeholder=" Add your text">
                <button> Add </button>
            </div>
            <ul id="list-container">
                <li class="checked">Task 1<span>&times;</span></li>
                <li>Task 2<span>&times;</span></li>
                <li>Task 3<span>&times;</span></li>
            </ul>
            <p id="empty-msg">Nothing here yet. Add a task above.</p>
            <div class="footer" id="footer">
                <span id="counter"></span>
                <button class="clear-btn" id="clear-btn">Clear completed</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
